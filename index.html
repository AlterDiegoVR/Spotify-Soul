<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SpotiSoul</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">

<style>
/* Una columna tipo explorador de carpetas: ruta arriba, separadores de cajón, lista abajo */
:root{
  --bg:#0a0c0b;--surface:rgba(22,25,23,.84);--fg:#eef2ef;--muted:#a1aaa4;--line:rgba(255,255,255,.10);
  --accent:#1ed760;--accent-ink:#04110a;--star:#ffc23d;--heart:#ff5a76;--tab:rgba(30,215,96,.13);--danger:#ff7b72;--spot:#1db954;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.qbar{flex-wrap:nowrap;gap:6px}.qbar .btn{flex:1 1 auto;white-space:nowrap;padding-left:8px;padding-right:8px;font-size:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;background:none;border:0;color:var(--fg);padding:0}
.brand .nm{color:var(--fg)}.brand em{font-style:normal;color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px}
.brand .ver{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);align-self:flex-end;margin:0 0 6px -4px}
.brand .logo{width:42px;height:42px;image-rendering:pixelated;flex:none}
.dest{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--tab);color:var(--fg);border:1px solid var(--line)}
.dest button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px}
.sync.ic{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;color:var(--accent)}.sync.ic.pend{color:var(--muted)}.sync.ic.bad{color:#ef7a6c}.sync[hidden]{display:none}
header.top .btns{flex-wrap:nowrap;gap:6px;align-items:center}
.btn.small.ic{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.brand .bt .ver{margin:3px 0 0 1px!important;align-self:flex-start!important}
.sync.bad{color:var(--danger);text-decoration:underline dotted}
.path{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.path button{font:inherit;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
.path .sep{opacity:.5}
.search{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
h2{font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);font:inherit;text-align:left;width:100%;min-width:0;text-decoration:none}
button.row,a.row{cursor:pointer}
.row:first-child{border-top:0}
button.row:hover,a.row:hover{background:var(--tab)}
.list .row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.flag{height:11px;width:auto;border-radius:2px;margin-left:7px;vertical-align:0;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
img.flag{width:auto!important;height:11px!important;min-width:0!important;flex:none!important;object-fit:contain;border-radius:2px!important}
.ccline img.flag{height:12px!important}
.flag.txt{height:auto;font-family:var(--mono);font-size:10px;padding:0 3px;color:var(--muted);box-shadow:0 0 0 1px var(--line)}
.flag.unk{height:auto;font-size:12px;line-height:1;box-shadow:none}
.flag.globe{height:auto;box-shadow:none;color:var(--muted)}.flag.globe svg{width:13px;height:13px;vertical-align:-2px}
.ccline{font-size:13px;color:var(--muted)}.ccline .flag{margin:0 2px 0 0;height:12px}
.ccf{margin-bottom:0}
.ssel{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.ssel .ssug{max-height:260px;overflow:auto}
.chk.deept{align-self:flex-end;min-height:48px;display:flex;align-items:center;gap:8px}
.row .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.row .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.secH{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:6px 0 -4px}
.menu .row{padding:14px}.menu .ic{width:28px;display:flex;justify-content:center;color:var(--accent);flex:none}.menu .arr{color:var(--muted);font-size:22px;line-height:1}
.menu .sub{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.row .meta{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;flex:0 1 auto}
.row .yr{font-family:var(--mono);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;width:3.2em;flex:none}
.row img{width:44px;height:44px;border-radius:4px;flex:none;object-fit:cover;background:var(--tab)}
.row select{width:auto;max-width:46%;font-size:13px;padding:6px}
.divider{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.crate .row{padding-left:0}
.crate .tabmark{width:6px;align-self:stretch;background:var(--accent);opacity:.85;flex:none;border-radius:0 3px 3px 0}
.empty{padding:16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:500;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.spot{background:var(--spot);color:#fff;border-color:var(--spot)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.pick{background:var(--tab);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center}
.pick img{width:96px;height:96px;border-radius:6px;object-fit:cover;flex:none}
.pick .in{display:flex;flex-direction:column;gap:8px;min-width:0}
.pick .lbl{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick .divider{font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.hero{display:flex;gap:14px;align-items:flex-end}
.hero img{width:112px;height:112px;border-radius:8px;object-fit:cover;flex:none}
.hero .in{min-width:0;display:flex;flex-direction:column;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input[type=text],input[type=password],input[type=search],textarea,select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.notice{font-size:13px;color:var(--fg);border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface);border-radius:0 8px 8px 0}
.notice.err{border-color:var(--danger)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
code{font-family:var(--mono);font-size:12.5px;background:var(--tab);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.foot{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.bar select{flex:1;min-width:160px}
progress{width:100%}
.tut p{margin:0;line-height:1.55}
.tl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.tut a{color:var(--accent)}
.tut code{display:inline-block;max-width:100%}
.pill{font:inherit;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.pend.on{background:#f0a23a;border-color:#f0a23a;color:#1a1004}
.fmtrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.roul{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.roul img{width:min(260px,70vw);height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px;max-width:100%}
.roul .t{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.heart{color:var(--heart)}
.btn.favon{border-color:var(--heart);color:var(--heart)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1100px 620px at 8% -8%,rgba(30,215,96,.30),transparent 62%),radial-gradient(900px 520px at 105% 12%,rgba(30,215,96,.12),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(30,215,96,.08),transparent 60%),var(--bg);overflow:hidden}
#bg .cv{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(7px) saturate(1.1);transform:scale(1.04);opacity:0;transition:opacity .6s ease}
@media (max-width:700px){#bg .cv{inset:0 0 auto 0;height:min(100vw,62vh);background-position:center top;filter:blur(1.5px) saturate(1.05);transform:none}#bg .sh{background:linear-gradient(180deg,rgba(8,10,9,.12) 0%,rgba(8,10,9,.40) min(55vw,34vh),rgba(8,10,9,.92) min(100vw,62vh),var(--bg) min(112vw,70vh))!important}}
#bg.on .cv{opacity:.9}
#bg .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,9,.30) 0%,rgba(8,10,9,.55) 45%,rgba(8,10,9,.78) 100%);opacity:0;transition:opacity .6s ease}
#bg.on .sh{opacity:1}
.wrap{position:relative;z-index:1}
.btn{background:rgba(255,255,255,.06)}
.btn.primary{background:var(--accent)}
.search,input[type=text],input[type=password],input[type=search],textarea,select{background:rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){#bg .cv,#bg .sh{transition:none}}
.row.al{align-items:center}
.row.al img{width:60px;height:60px}
.row.al .at{color:inherit;text-decoration:none;font-weight:500}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:3px}
.yrb{font-family:var(--mono);font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.yrb.ed{font-weight:600}
.stars{display:inline-flex}
.stars button{background:none;border:0;padding:0 1px;font-size:18px;line-height:1;color:var(--line);cursor:pointer}
.stars button.on{color:var(--star)}
.mk{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:transparent;font-weight:700;font-size:16px;cursor:pointer}
.mk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yf{display:inline-flex;gap:4px;align-items:center}
.yf input{width:5.2em;padding:3px 6px;font-family:var(--mono);font-size:13px}
textarea.code{font-family:var(--mono);font-size:12px;min-height:70px;width:100%;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (min-width:700px){.row img{width:56px;height:56px}.row.al img{width:84px;height:84px}.hero img{width:180px;height:180px;border-radius:10px}.pick img{width:130px;height:130px}.stars button{font-size:20px}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="cv"></div><div class="sh"></div></div>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>
<script>
const APP_VER='1.0P';
(async function(){
"use strict";
/* ================= estado y almacenamiento local ================= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
/* La colección (md_data) y la base de sincronización (md_base) viven en IndexedDB, que tiene cientos de MB.
   localStorage (unos 5 MB) queda solo para la configuración pequeña. Si algo no se puede guardar, se avisa. */
const IDB=await new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
  setTimeout(()=>fin({err:'tiempo agotado'}),5000);
  try{const rq=indexedDB.open('spotisoul',1);rq.onupgradeneeded=()=>{rq.result.createObjectStore('kv')};
    rq.onerror=()=>fin({err:String(rq.error||'no se pudo abrir')});
    rq.onsuccess=()=>{const db=rq.result;try{const tx=db.transaction('kv','readonly'),st=tx.objectStore('kv'),a=st.get('md_data'),b=st.get('md_base');
      tx.oncomplete=()=>fin({db,data:a.result,base:b.result});tx.onerror=()=>fin({err:String(tx.error||'lectura')})}catch(e){fin({err:String(e)})}}}
  catch(e){fin({err:String(e)})}});
const idbPut=(k,v)=>new Promise((ok,ko)=>{try{const tx=IDB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>ok();tx.onerror=()=>ko(tx.error);tx.onabort=()=>ko(tx.error||new Error('abortado'))}catch(e){ko(e)}});
let saveErr=null,saveT=null,saving=null,saveAgain=false,lsHasData=(()=>{try{return localStorage.getItem('md_data')!==null}catch(_){return false}})();
async function saveNow(){
  clearTimeout(saveT);saveT=null;
  if(saving){saveAgain=true;return saving}
  saving=(async()=>{
    try{
      if(IDB.db){await idbPut('md_data',D);if(lsHasData){if(BASE!=null)await idbPut('md_base',BASE);LS.del('md_data');LS.del('md_base');lsHasData=false}}
      else if(!LS.set('md_data',D))throw new Error('el almacenamiento del navegador está lleno');
      if(saveErr){saveErr=null;render()}
    }catch(e){const m=(e&&(e.message||e.name))||String(e);if(saveErr!==m){saveErr=m;render()}}
    saving=null;if(saveAgain){saveAgain=false;saveNow()}
  })();
  return saving}
function saveSoon(){if(!saveT)saveT=setTimeout(saveNow,300)}
let BASE=IDB.db&&IDB.base!==undefined?IDB.base:LS.get('md_base',null);
function setBase(v){BASE=v;if(IDB.db)idbPut('md_base',v).catch(()=>{});else if(v===null)LS.del('md_base');else LS.set('md_base',v)}
const REDIRECT=location.origin+location.pathname;
const SCOPES='user-follow-read user-library-read playlist-read-private playlist-read-collaborative playlist-modify-private playlist-modify-public';
const GIST_FILE='mi-discoteca.json';
let cfg=LS.get('md_cfg',{clientId:'',ghToken:'',gistId:''});
let tok=LS.get('md_tok',null);
let D=(IDB.db&&IDB.data)||LS.get('md_data',null)||{v:1,updated:0,tree:{genres:[]},bands:{}};
if(IDB.db&&!IDB.data&&lsHasData)setTimeout(saveNow,0);
const UI={visible:new Set(),sim:{},fullDisco:false,showCode:false,view:{k:'home'},q:'',form:null,confirm:null,msg:null,busy:null,sel:new Set(),showSingles:false,spResults:null,playlists:null,syncState:'',pick:null};
const app=document.getElementById('app');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const byName=(a,b)=>String(a&&a.name||'').localeCompare(String(b&&b.name||''),'es',{sensitivity:'base'});
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const J=v=>esc(JSON.stringify(v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function say(text,err){UI.msg={text,err};formFocused()?bgRender():render();clearTimeout(say.t);say.t=setTimeout(()=>{UI.msg=null;bgRender()},6000)}
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('ssq')){try{e.target.select()}catch(_){}ssSuggest(e.target)}});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('ssq')){const inp=e.target;setTimeout(()=>{if(document.activeElement===inp)return;const box=inp.parentNode&&inp.parentNode.querySelector('.ssug');if(box)box.hidden=true;const sel=document.getElementById(inp.dataset.for);if(sel){const o=sel.options[sel.selectedIndex];inp.value=o&&o.value?o.text:''}},250)}});
let lastTouch=0;['pointerdown','keydown','change','input','focusin'].forEach(ev=>document.addEventListener(ev,()=>{lastTouch=Date.now()},true));
function formFocused(){const a=document.activeElement;return !!(a&&a.closest&&a.closest('#app')&&(a.tagName==='SELECT'||a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!/^(checkbox|radio|button|submit)$/.test(a.type))))}
let bgRT=null;
function bgRender(){clearTimeout(bgRT);bgRT=null;
  if(formFocused()||Date.now()-lastTouch<3000){bgRT=setTimeout(bgRender,1500);return}
  const vals={};document.querySelectorAll('#app select[id],#app textarea[id]:not([readonly]),#app input[id]:not([type=checkbox]):not([type=radio])').forEach(e=>{vals[e.id]=e.value});
  render();
  for(const id in vals){const e=document.getElementById(id);if(e&&e.value!==vals[id])e.value=vals[id]}}

/* ================= guardado + sincronización (Gist) ================= */
let saveTimer=null,pushing=false,pendingPush=false,retryTimer=null,retryN=0,ghUntil=0,lastPull=0;
// Los cambios se guardan al momento en este dispositivo y se suben a GitHub solo al dejar la app, al volver a ella,
// como mucho cada 3 minutos si hay cambios pendientes, o con "Sincronizar ahora".
let dirty=LS.get('md_dirty',false);
function setDirty(v){if(dirty!==v){dirty=v;LS.set('md_dirty',v)}}
function touch(){D.updated=Date.now();saveSoon();if(cfg.ghToken){setDirty(true);if(!pushing&&UI.syncState!=='Sin sincronizar'){UI.syncState='Cambios sin subir';renderSync()}
  if(!saveTimer)saveTimer=setTimeout(()=>{saveTimer=null;if(dirty&&document.visibilityState==='visible')pushRemote()},3*60000)}}
async function gh(path,opts={}){
  if(Date.now()<ghUntil){const e=new Error('GitHub 403: límite de la API, esperando');e.status=403;e.wait=ghUntil-Date.now();throw e}
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Authorization':'Bearer '+cfg.ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json',...(opts.headers||{})}});

        const list=r?(r.urls||(r.resource?[r]:[])):[],by=new Map(list.map(u=>[u.resource,u]));

      <div class="section"><span class="hint">También en</span>${(b.also||[]).filter(x=>G(x.g)).length?`<div class="tags">${(b.also||[]).map((x,i)=>G(x.g)?`<button type="button" class="btn small" data-act="rmAlso" data-i="${i}">${esc(pName({g:x.g,s:x.s||null}))} ✕</button>`:'').join('')}</div>`:''}

async function submitForm(id){

  if(id==='f_code'){await applyCode(val('f_codein'));return}

  else if(f.t==='sub'){const n=val('f_name');if(!n)return;const host=v.k==='sub'?SG(G(v.g),v.s):G(v.g);host.subs.push({id:rid(),name:n,subs:[]});touch()}
  else if(f.t==='renameGenre'){const n=val('f_name');if(!n)return;G(v.g).name=n;touch()}
  else if(f.t==='renameSub'){const n=val('f_name');if(!n)return;SG(G(v.g),v.s).name=n;touch()}
  else if(f.t==='spsearch'){f.q=val('f_sq');if(!f.q)return;try{UI.spResults=(await sp('/search?type=artist&limit=10&q='+encodeURIComponent(f.q))).artists.items}catch(e){say(e.message==='nologin'?'Conecta Spotify en Ajustes.':e.message,true)}render();return}
  else if(f.t==='year'){const b=D.bands[f.b||v.id],al=(b.albums||[]).find(x=>x.id===f.a),y=val('f_y');if(y&&!/^\d{4}$/.test(y)){say('Escribe el año con cuatro cifras, por ejemplo 1983.',true);return}b.years=b.years||{};const auto=al?((al.md||'').slice(0,4)||al.y||''):'';if(!y||y===auto)delete b.years[f.a];else b.years[f.a]=y;touch()}
  else if(f.t==='edit'){const b=D.bands[v.id];b.parentId=val('f_parent')||null;b.note=val('f_note');{const r=val('f_rym');if(r&&!/^https?:\/\/\S+$/i.test(r)){say('Pega una dirección web completa (que empiece por https://).',true);return}if(r)b.rym=r;else delete b.rym}const [g,s]=(val('f_place')||'|').split('|');b.genreId=g||null;b.subId=s||null;b.also=(b.also||[]).filter(x=>!(x.g===b.genreId&&(x.s||null)===(b.subId||null)));fixPrimary(b);touch()}
  UI.form=null;render();
}

  const body=!cfg.clientId?vSetup():v==='genre'?vGenre():v==='sub'?vSub():v==='band'?vBand():v==='forgotten'?vForgotten():v==='favs'?vFavs():v==='rated'||v==='albums'||v==='filter'||v==='roulette'?vAlbums():v==='today'?vToday():v==='mkpl'?vMakePlaylist():v==='tutorial'?vTutorial(false):v==='import'?vImport():v==='settings'?vSettings():v==='unclassified'?vUnclassified():vHome();
  let notes='';
  if(saveErr)notes+=`<div class="notice err"><b>⚠ No se están guardando los cambios en este dispositivo</b> (${esc(saveErr)}). No cierres la app: ${cfg.ghToken?'pulsa “Sincronizar ahora” en Ajustes para subirlos a GitHub, y ':''}avísame del error.</div>`;
  else if(!IDB.db)notes+=`<div class="notice">Este navegador no deja usar el almacenamiento grande (${esc(IDB.err||'')}); la colección se guarda en el pequeño, de unos 5 MB.</div>`;
  if(cfg.clientId&&!tok&&v!=='settings')notes+=`<div class="notice">Spotify no está conectado. <button class="btn small spot" data-act="login">Conectar</button></div>`;
  if(tok&&Date.now()<spBlocked&&LS.get('md_spdis',0)!==spBlocked&&!(UI.msg&&/Spotify/.test(UI.msg.text)))notes+=`<div class="notice err" style="display:flex;gap:10px;align-items:flex-start"><span style="flex:1">${esc(spErr({message:'ratelimit'}))}</span><button class="btn small ic" data-act="spDismiss" aria-label="Cerrar aviso" title="Cerrar">✕</button></div>`;
  if(UI.msg)notes+=`<div class="notice${UI.msg.err?' err':''}">${esc(UI.msg.text)}</div>`;
  if(UI.undo)notes+=`<div class="notice">${UI.undo.bands.length===1?`“${esc(UI.undo.bands[0].name)}” quitada de tu colección.`:`${UI.undo.bands.length} bandas quitadas de tu colección.`} <button class="btn small" data-act="undo">Deshacer</button></div>`;
  const n=bands().length;
  app.innerHTML=`<header class="top"><button class="brand" data-act="home"><img class="logo" src="logo.svg" alt=""><span class="bt"><span class="nm">Spoti<em>Soul</em></span><small class="ver">v${APP_VER}</small></span></button><div class="btns"><button class="sync ic${UI.syncState==='Sin sincronizar'?' bad':''}" id="syncst" data-act="syncInfo" ${UI.syncState?'':'hidden'} title="${esc(UI.syncErr||UI.syncState)}" aria-label="${esc(UI.syncState)}">${syncIcon()}</button>${cfg.clientId?`<button class="btn small ic" data-act="tutorial" aria-label="Ayuda y tutorial" title="Ayuda">?</button><button class="btn small ic" data-act="settings" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>`:''}</div></header>${notes}${body}${n?`<div class="foot">${n} bandas</div>`:''}`;
  for(const id in keep){const el=document.getElementById(id);if(el&&el.type!=='checkbox')el.value=keep[id]}
  ssSync();
}

/* ================= arranque ================= */
function showFatal(e){console.error(e);app.innerHTML=`<header class="top"><button class="brand" onclick="location.reload()"><span class="nm">Spoti<em>Soul</em></span></button></header><div class="notice err"><b>Algo ha fallado al mostrar la colección.</b> Copia este mensaje y pásaselo a Claude:<br><code>${esc((e&&e.message)||e)}</code><br><code>${esc(((e&&e.stack)||'').split('\n').slice(0,3).join(' | '))}</code></div><div class="btns"><button class="btn" onclick="location.reload()">Recargar</button></div>`}
window.addEventListener('error',ev=>{if(!app.querySelector('header'))showFatal(ev.error||ev.message)});
window.addEventListener('unhandledrejection',ev=>{if(!app.querySelector('header'))showFatal(ev.reason)});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
window.addEventListener('popstate',e=>{const v=e.state&&e.state.v;
  if(v&&JSON.stringify(v)===JSON.stringify(UI.view)){if(UI.selMode){UI.selMode=false;UI.sel.clear();UI.confirmDel=false}render();return}
  go(v&&v.k?v:{k:'home'},true)});
function enterSel(id){UI.selMode=true;UI.sel.clear();UI.confirmDel=false;if(id)UI.sel.add(id);try{history.pushState({v:UI.view,sel:1},'')}catch(_){}render()}
function endSel(){UI.selMode=false;UI.sel.clear();UI.confirmDel=false;try{if(history.state&&history.state.sel)history.back()}catch(_){}}
function exitSel(){const back=history.state&&history.state.sel;endSel();if(!back)render()}
// dejar pulsada una banda: entra en modo selección con ella marcada
let lp=null,lpFired=false;const LP_VIEWS=['genre','sub','favs','home'];
app.addEventListener('pointerdown',e=>{lpFired=false;if(UI.selMode||e.button>0)return;const el=e.target.closest('[data-go]');if(!el||!el.closest('.list'))return;
  if(!LP_VIEWS.includes(UI.view.k)||(UI.view.k==='home'&&!UI.q))return;let v;try{v=JSON.parse(el.dataset.go)}catch(_){return}if(v.k!=='band')return;
  clearTimeout(lp&&lp.t);lp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{lp=null;lpFired=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}enterSel(v.id)},500)}});
const lpCancel=()=>{if(lp){clearTimeout(lp.t);lp=null}};
app.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10)lpCancel()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>app.addEventListener(ev,lpCancel));window.addEventListener('scroll',lpCancel,{passive:true});
app.addEventListener('click',e=>{if(lpFired){lpFired=false;e.preventDefault();e.stopPropagation()}},true);
app.addEventListener('contextmenu',e=>{if(e.target.closest('.list [data-go]')&&LP_VIEWS.includes(UI.view.k))e.preventDefault()});
(async()=>{try{fixTree();render()}catch(e){showFatal(e);return}await handleCallback();try{history.replaceState({v:UI.view},'')}catch(_){}try{render()}catch(e){showFatal(e)}await pullRemote();await autoImport();setTimeout(photoLoader,5000);setInterval(photoLoader,2*3600e3);setTimeout(()=>mbLoader(),15000);setInterval(()=>mbLoader(),3600e3);setTimeout(()=>ccLoader(),8000);setInterval(()=>ccLoader(),10*60000);})();
})();
</script>
