<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Spotify Soul</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Una columna tipo explorador de carpetas: ruta arriba, separadores de cajón, lista abajo */
:root{
  --bg:#0a0c0b;--surface:rgba(22,25,23,.84);--fg:#eef2ef;--muted:#a1aaa4;--line:rgba(255,255,255,.10);
  --accent:#1ed760;--accent-ink:#04110a;--star:#ffc23d;--heart:#ff5a76;--tab:rgba(30,215,96,.13);--danger:#ff7b72;--spot:#1db954;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;background:none;border:0;color:var(--fg);padding:0}
.brand span{color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;image-rendering:pixelated;flex:none}
.dest{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--tab);color:var(--fg);border:1px solid var(--line)}
.dest button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px}
.sync.bad{color:var(--danger);text-decoration:underline dotted}
.path{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.path button{font:inherit;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
.path .sep{opacity:.5}
.search{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
h2{font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);font:inherit;text-align:left;width:100%;min-width:0;text-decoration:none}
button.row,a.row{cursor:pointer}
.row:first-child{border-top:0}
button.row:hover,a.row:hover{background:var(--tab)}
.row .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.row .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.row .meta{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.row .yr{font-family:var(--mono);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;width:3.2em;flex:none}
.row img{width:44px;height:44px;border-radius:4px;flex:none;object-fit:cover;background:var(--tab)}
.row select{width:auto;max-width:46%;font-size:13px;padding:6px}
.divider{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.crate .row{padding-left:0}
.crate .tabmark{width:6px;align-self:stretch;background:var(--accent);opacity:.85;flex:none;border-radius:0 3px 3px 0}
.empty{padding:16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:500;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.spot{background:var(--spot);color:#fff;border-color:var(--spot)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.pick{background:var(--tab);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center}
.pick img{width:96px;height:96px;border-radius:6px;object-fit:cover;flex:none}
.pick .in{display:flex;flex-direction:column;gap:8px;min-width:0}
.pick .lbl{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick .divider{font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.hero{display:flex;gap:14px;align-items:flex-end}
.hero img{width:112px;height:112px;border-radius:8px;object-fit:cover;flex:none}
.hero .in{min-width:0;display:flex;flex-direction:column;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input[type=text],input[type=password],input[type=search],textarea,select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.notice{font-size:13px;color:var(--fg);border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface);border-radius:0 8px 8px 0}
.notice.err{border-color:var(--danger)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
code{font-family:var(--mono);font-size:12.5px;background:var(--tab);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.foot{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.bar select{flex:1;min-width:160px}
progress{width:100%}
.heart{color:var(--heart)}
.btn.favon{border-color:var(--heart);color:var(--heart)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1100px 620px at 8% -8%,rgba(30,215,96,.30),transparent 62%),radial-gradient(900px 520px at 105% 12%,rgba(30,215,96,.12),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(30,215,96,.08),transparent 60%),var(--bg);overflow:hidden}
#bg .cv{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(7px) saturate(1.1);transform:scale(1.04);opacity:0;transition:opacity .6s ease}
#bg.on .cv{opacity:.9}
#bg .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,9,.30) 0%,rgba(8,10,9,.55) 45%,rgba(8,10,9,.78) 100%);opacity:0;transition:opacity .6s ease}
#bg.on .sh{opacity:1}
.wrap{position:relative;z-index:1}
.btn{background:rgba(255,255,255,.06)}
.btn.primary{background:var(--accent)}
.search,input[type=text],input[type=password],input[type=search],textarea,select{background:rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){#bg .cv,#bg .sh{transition:none}}
.row.al{align-items:center}
.row.al img{width:60px;height:60px}
.row.al .at{color:inherit;text-decoration:none;font-weight:500}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:3px}
.yrb{font-family:var(--mono);font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.yrb.ed{font-weight:600}
.stars{display:inline-flex}
.stars button{background:none;border:0;padding:0 1px;font-size:18px;line-height:1;color:var(--line);cursor:pointer}
.stars button.on{color:var(--star)}
.mk{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:transparent;font-weight:700;font-size:16px;cursor:pointer}
.mk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yf{display:inline-flex;gap:4px;align-items:center}
.yf input{width:5.2em;padding:3px 6px;font-family:var(--mono);font-size:13px}
textarea.code{font-family:var(--mono);font-size:12px;min-height:70px;width:100%;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (min-width:700px){.row img{width:56px;height:56px}.row.al img{width:84px;height:84px}.hero img{width:180px;height:180px;border-radius:10px}.pick img{width:130px;height:130px}.stars button{font-size:20px}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="cv"></div><div class="sh"></div></div>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>
<script>
(function(){
"use strict";
/* ================= estado y almacenamiento local ================= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
const REDIRECT=location.origin+location.pathname;
const SCOPES='user-follow-read user-library-read playlist-read-private playlist-read-collaborative';
const GIST_FILE='mi-discoteca.json';
let cfg=LS.get('md_cfg',{clientId:'',ghToken:'',gistId:''});
let tok=LS.get('md_tok',null);
let D=LS.get('md_data',null)||{v:1,updated:0,tree:{genres:[]},bands:{}};
const UI={sim:{},fullDisco:false,showCode:false,view:{k:'home'},q:'',form:null,confirm:null,msg:null,busy:null,sel:new Set(),showSingles:false,spResults:null,playlists:null,syncState:'',pick:null};
const app=document.getElementById('app');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const byName=(a,b)=>String(a&&a.name||'').localeCompare(String(b&&b.name||''),'es',{sensitivity:'base'});
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const J=v=>esc(JSON.stringify(v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function say(text,err){UI.msg={text,err};render();clearTimeout(say.t);say.t=setTimeout(()=>{UI.msg=null;render()},6000)}

/* ================= guardado + sincronización (Gist) ================= */
let saveTimer=null,pushing=false,pendingPush=false,retryTimer=null,retryN=0,ghUntil=0,lastPull=0;
function touch(){D.updated=Date.now();LS.set('md_data',D);if(cfg.ghToken){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;pushRemote()},5000)}}
async function gh(path,opts={}){
  if(Date.now()<ghUntil){const e=new Error('GitHub 403: límite de la API, esperando');e.status=403;e.wait=ghUntil-Date.now();throw e}
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Authorization':'Bearer '+cfg.ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(_){}const e=new Error('GitHub '+r.status+(m?': '+m:''));e.status=r.status;const ra=+(r.headers.get('retry-after')||0),rs=+(r.headers.get('x-ratelimit-reset')||0);e.wait=ra?ra*1000:(rs&&r.headers.get('x-ratelimit-remaining')==='0'?rs*1000-Date.now():0);if(e.wait>0)ghUntil=Date.now()+e.wait;else if(/rate limit/i.test(m))ghUntil=Date.now()+10*60000;throw e}
  return r.json();
}
async function pushRemote(){
  if(!cfg.ghToken)return;
  if(pushing){pendingPush=true;return}
  pushing=true;UI.syncState='Guardando…';renderSync();
  try{
    const body=JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(D)}}});
    if(!cfg.gistId){
      const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Spotify Soul (datos)',public:false,files:{[GIST_FILE]:{content:JSON.stringify(D)}}})});
      cfg.gistId=g.id;LS.set('md_cfg',cfg);
    }else await gh('/gists/'+cfg.gistId,{method:'PATCH',body});
    UI.syncState='Sincronizado';
    UI.syncErr='';retryN=0;clearTimeout(retryTimer);
  }catch(e){console.error(e);UI.syncState='Sin sincronizar';
    UI.syncErr=e.status===401?'El token de GitHub no es válido o ha caducado. Pon uno nuevo en Ajustes.':e.status===404?'No encuentro el Gist de la colección. Revisa la sincronización en Ajustes.':(e.status===403||e.status===429)?'GitHub ha llegado al límite de peticiones por hora de tu cuenta. Se sincronizará sola'+(ghUntil>Date.now()?' hacia las '+new Date(ghUntil).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):' en cuanto pase')+'. Tus cambios están guardados en este dispositivo.':e.status===422?'GitHub ha rechazado los datos ('+e.message+').':'No se pudo conectar con GitHub ('+(e.message||'sin conexión')+'). Se reintenta solo.';
    if(e.status!==401&&e.status!==404){retryN++;const wait=Math.min(Math.max((e.wait||0)+2000,30000*Math.pow(2,retryN-1)),65*60000);clearTimeout(retryTimer);retryTimer=setTimeout(pushRemote,wait)}}
  pushing=false;renderSync();
  if(pendingPush){pendingPush=false;pushRemote()}
}
async function adoptRemote(){
  const g=await gh('/gists/'+cfg.gistId);const f=g.files&&g.files[GIST_FILE];
  if(!f)throw new Error('No encuentro la colección en ese Gist.');
  let text=f.content;if(f.truncated)text=await (await fetch(f.raw_url)).text();
  D=JSON.parse(text);fixTree();LS.set('md_data',D);UI.syncState='Sincronizado';
}
const makeCode=()=>btoa(unescape(encodeURIComponent(JSON.stringify({c:cfg.clientId,t:cfg.ghToken,g:cfg.gistId}))));
async function applyCode(code){
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))))}catch(_){say('Ese código no es válido. Cópialo entero desde Ajustes del otro dispositivo.',true);return}
  if(!o.t||!o.g){say('Ese código no trae la sincronización. Actívala primero en el otro dispositivo.',true);return}
  cfg={clientId:o.c||cfg.clientId,ghToken:o.t,gistId:o.g};LS.set('md_cfg',cfg);
  try{await adoptRemote();UI.view={k:'home'};say('Listo: tienes aquí la misma colección que en el otro dispositivo.'+(tok?'':' Ahora conecta Spotify.'))}
  catch(e){say('No se pudo cargar la colección: '+e.message,true)}
  render();
}
function exportForClaude(all){
  const nodes=[];for(const g of D.tree.genres.slice().sort(byName)){nodes.push({id:g.id,ruta:g.name});const rec=(list,pre)=>{for(const x of list.slice().sort(byName)){const r=pre+' / '+x.name;nodes.push({id:x.id,ruta:r});rec(x.subs,r)}};rec(g.subs,g.name)}
  const src=all?topBands(()=>true):unclassified();
  const bs=src.map(b=>{const o={id:b.id,nombre:b.name};if((b.spGenres||[]).length)o.spotify=b.spGenres.slice(0,5);if(all)o.en=places(b).map(p=>p.s||p.g);return o});
  return JSON.stringify({mi_discoteca:all?'reubicar':'clasificar',generos:nodes,bandas:bs});
}
function applyClaude(text){
  let o;const m=String(text).match(/\{[\s\S]*\}/);try{o=JSON.parse(m?m[0]:text)}catch(_){say('No reconozco ese texto. Pega la respuesta de Claude entera, empezando por la llave {.',true);return}
  const list=Array.isArray(o.asignar)?o.asignar:Array.isArray(o.assign)?o.assign:[];
  let ok=0,bad=0,kept=0,moved=0;
  for(const it of list){const b=D.bands[it.id];const to=(it.a||it.to||[]).map(id=>G(id)?{g:id,s:null}:(f=>f?{g:f.g.id,s:id}:null)(findAny(id))).filter(Boolean);
    if(!b||!to.length){bad++;continue}
    if((places(b).length||b.parentId)&&!it.mover){kept++;continue}
    if(it.mover)moved++;
    b.parentId=null;b.genreId=to[0].g;b.subId=to[0].s;b.also=to.slice(1);fixPrimary(b);ok++}
  if(!ok&&kept){say('Todas esas bandas ya las habías colocado tú; no se ha cambiado nada.');return}
  if(!ok){say('No se ha aplicado nada. Comprueba que has pegado la respuesta correcta.',true);return}
  touch();UI.view={k:'home'};say(`Clasificadas ${ok} banda${ok===1?'':'s'}`+(moved?` (${moved} cambiadas de sitio)`:'')+'.'+(kept?` ${kept} ya las habías colocado tú y no se han tocado.`:'')+(bad?` ${bad} no se pudieron aplicar.`:''));
}
async function pullRemote(){
  if(!cfg.ghToken||!cfg.gistId)return false;
  try{
    UI.syncState='Comprobando…';renderSync();
    const g=await gh('/gists/'+cfg.gistId);
    const f=g.files&&g.files[GIST_FILE];if(!f)return false;
    let text=f.content;
    if(f.truncated){const r=await fetch(f.raw_url);text=await r.text()}
    const remote=JSON.parse(text);
    if((remote.updated||0)>(D.updated||0)){D=remote;fixTree();LS.set('md_data',D);UI.syncState='Sincronizado';render();return true}
    if((remote.updated||0)<(D.updated||0))pushRemote();else{UI.syncState='Sincronizado';renderSync()}
  }catch(e){UI.syncState='Sin sincronizar';renderSync();console.error(e)}
  return false;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!saveTimer&&!pushing&&Date.now()-lastPull>60000){lastPull=Date.now();pullRemote()}if(document.visibilityState==='hidden'&&saveTimer){clearTimeout(saveTimer);saveTimer=null;pushRemote()}});

/* ================= Spotify: login PKCE + API ================= */
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const arr=new Uint8Array(48);crypto.getRandomValues(arr);
  const verifier=b64url(arr);LS.set('md_verifier',verifier);
  const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  const p=new URLSearchParams({client_id:cfg.clientId,response_type:'code',redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:challenge,scope:SCOPES});
  location.href='https://accounts.spotify.com/authorize?'+p;
}
async function tokenReq(params){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:cfg.clientId,...params})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||('Spotify '+r.status));
  tok={access:j.access_token,refresh:j.refresh_token||(tok&&tok.refresh),exp:Date.now()+(j.expires_in-60)*1000};
  LS.set('md_tok',tok);return tok;
}
async function handleCallback(){
  const q=new URLSearchParams(location.search);
  if(q.get('error')){history.replaceState(null,'',REDIRECT);say('Spotify no dio permiso: '+q.get('error'),true);return}
  const code=q.get('code');if(!code)return;
  history.replaceState(null,'',REDIRECT);
  try{await tokenReq({grant_type:'authorization_code',code,redirect_uri:REDIRECT,code_verifier:LS.get('md_verifier','')});LS.del('md_verifier');say('Conectado con Spotify.')}
  catch(e){say('No se pudo conectar con Spotify: '+e.message,true)}
}
async function access(){
  if(!tok)throw new Error('nologin');
  if(Date.now()>tok.exp){try{await tokenReq({grant_type:'refresh_token',refresh_token:tok.refresh})}catch(e){tok=null;LS.del('md_tok');render();throw new Error('nologin')}}
  return tok.access;
}
let spBlocked=LS.get('md_block',0),spQueue=Promise.resolve();
const spWait=()=>{const p=spQueue.then(()=>sleep(350));spQueue=p.catch(()=>{});return p};
function waitText(){const m=Math.ceil((spBlocked-Date.now())/60000);return m<=1?'en un minuto':m<90?`en unos ${m} minutos`:`en unas ${Math.round(m/60)} horas`}
function spErr(e){const m=e&&e.message;if(m==='nologin')return'La sesión de Spotify ha caducado. Vuelve a conectar.';if(m==='ratelimit')return`Spotify ha pedido una pausa por exceso de peticiones. Vuelve a intentarlo ${waitText()}. Lo que ya está cargado sigue disponible.`;return m||'Error de Spotify'}
async function sp(path,tries=0){
  if(Date.now()<spBlocked)throw new Error('ratelimit');
  await spWait();
  const url=path.startsWith('http')?path:'https://api.spotify.com/v1'+path;
  const r=await fetch(url,{headers:{Authorization:'Bearer '+await access()}});
  if(r.status===401&&tries<1){tok.exp=0;return sp(path,tries+1)}
  if(r.status===429){const s=+(r.headers.get('Retry-After')||5);if(s<=8&&tries<2){await sleep(s*1000+500);return sp(path,tries+1)}spBlocked=Date.now()+Math.max(s,30)*1000;LS.set('md_block',spBlocked);throw new Error('ratelimit')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(_){}throw new Error('Spotify '+r.status+(m?': '+m:''))}
  return r.json();
}
async function spAll(path,key){ // pagina siguiendo "next"
  let url=path,out=[],n=0;
  while(url&&n++<200){const r=await sp(url);const page=key?r[key]:r;out=out.concat(page.items||[]);url=page.next}
  return out;
}

const G=id=>D.tree.genres.find(g=>g.id===id);
function walk(list,fn,path=[]){for(const x of list||[]){fn(x,path);walk(x.subs,fn,path.concat(x))}}
function findSub(g,id){let r=null;if(g&&id)walk(g.subs,(x,p)=>{if(x.id===id)r={s:x,path:p}});return r}
const SG=(g,id)=>{const r=findSub(g,id);return r&&r.s};
const subPath=(g,id)=>{const r=findSub(g,id);return r?r.path.concat(r.s):[]};
function findAny(id){for(const g of D.tree.genres){const r=findSub(g,id);if(r)return{g,s:r.s,path:r.path}}return null}
function allSubs(){const out=[];for(const g of D.tree.genres)walk(g.subs,(x,p)=>out.push({g,s:x,path:p}));return out}
const twins=x=>allSubs().filter(o=>norm(o.s.name)===norm(x.name));
function shareIds(x){const ids=new Set(),st=[x];while(st.length){const n=st.pop();for(const t of twins(n)){if(ids.has(t.s.id))continue;ids.add(t.s.id);for(const c of t.s.subs)st.push(c)}}ids.add(x.id);return ids}
function sharedChildren(x){const seen=new Map();for(const t of twins(x).sort((a,b)=>(a.s===x?-1:b.s===x?1:0)))for(const c of t.s.subs)if(!seen.has(norm(c.name)))seen.set(norm(c.name),c);for(const c of x.subs)if(!seen.has(norm(c.name)))seen.set(norm(c.name),c);return[...seen.values()]}
function descIds(x){const ids=[x.id];walk(x.subs,y=>ids.push(y.id));return ids}
function fixData(){
  if(!D||typeof D!=='object')D={v:1,updated:0,tree:{genres:[]},bands:{}};
  if(!D.bands||typeof D.bands!=='object')D.bands={};
  if(!D.ignored||typeof D.ignored!=='object')D.ignored={};
  for(const k of Object.keys(D.bands)){const b=D.bands[k];
    if(!b||typeof b!=='object'){delete D.bands[k];continue}
    b.id=k;b.name=String(b.name||'(sin nombre)');
    for(const f of ['albums','hidden','also','picked','spGenres'])if(!Array.isArray(b[f]))b[f]=[];
    b.albums=b.albums.filter(a=>a&&a.id).map(a=>({...a,t:String(a.t||'(sin título)'),y:String(a.y||'')}));
    if(b.parentId&&(!D.bands[b.parentId]||b.parentId===k))b.parentId=null;}
  const seen=new Set();for(const b of Object.values(D.bands)){let x=b,n=0;seen.clear();while(x&&x.parentId){if(seen.has(x.id)||n++>20){x.parentId=null;break}seen.add(x.id);x=D.bands[x.parentId]}}
}
function fixTree(){fixData();if(!D.tree||!Array.isArray(D.tree.genres))D.tree={genres:[]};for(const g of D.tree.genres){if(!Array.isArray(g.subs))g.subs=[];walk(g.subs,x=>{if(!Array.isArray(x.subs))x.subs=[]})}}
function places(b){const r=rootOf(b),out=[];if(G(r.genreId))out.push({g:r.genreId,s:r.subId||null});for(const x of r.also||[])if(G(x.g)&&!out.some(o=>o.g===x.g&&o.s===(x.s||null)))out.push({g:x.g,s:x.s||null});return out}
const inPlace=(b,gid,sid)=>places(b).some(p=>p.g===gid&&p.s===(sid||null));
const pName=p=>{const g=G(p.g);return g?[g.name,...subPath(g,p.s).map(x=>x.name)].join(' / '):''};
function addAlso(b,g,s){s=s||null;if(!b.genreId){b.genreId=g;b.subId=s;return true}if((b.genreId===g&&(b.subId||null)===s)||(b.also||[]).some(x=>x.g===g&&(x.s||null)===s))return false;b.also=(b.also||[]).concat({g,s});return true}
function fixPrimary(b){b.also=(b.also||[]).filter(x=>G(x.g));if(!G(b.genreId)&&b.also.length){const f=b.also.shift();b.genreId=f.g;b.subId=f.s}}
function placeName(b){const r=rootOf(b),g=G(r.genreId);return g?[g.name,...subPath(g,r.subId).map(x=>x.name)].join(' / '):''}
const bands=()=>Object.values(D.bands);
const children=id=>bands().filter(b=>b.parentId===id).sort(byName);
function rootOf(b){let x=b,n=0;while(x&&x.parentId&&D.bands[x.parentId]&&n++<10)x=D.bands[x.parentId];return x}
function placeOf(b){const r=rootOf(b);const g=G(r.genreId);return{g,s:SG(g,r.subId)}}
const topBands=f=>bands().filter(b=>!b.parentId&&f(b)).sort(byName);
function countIn(gid,sid){
  if(sid!==undefined){const f=findAny(sid);const ids=f?shareIds(f.s):new Set([sid]);return bands().filter(b=>places(b).some(p=>ids.has(p.s))).length}
  const g=G(gid),ids=new Set();if(g)for(const x of g.subs)shareIds(x).forEach(i=>ids.add(i));
  return bands().filter(b=>places(b).some(p=>p.g===gid||ids.has(p.s))).length}
const unclassified=()=>topBands(b=>!places(b).length);
const bandBySid=sid=>bands().find(b=>b.sid===sid);
const imgOf=imgs=>{if(!imgs||!imgs.length)return'';const s=imgs.slice().sort((a,b)=>(a.width||0)-(b.width||0));return(s.find(i=>(i.width||0)>=160)||s[s.length-1]).url};
function addArtist(a,extra={},force=false){
  if(!a||!a.id||!a.name)return{b:null,isNew:false};
  D.ignored=D.ignored||{};if(D.ignored[a.id]){if(!force&&!bandBySid(a.id))return{b:null,isNew:false,ignored:true};delete D.ignored[a.id]} // a = objeto artista de Spotify (completo o simplificado)
  let b=bandBySid(a.id);

function ago(ts){if(!ts)return'nunca abierta';const d=Math.floor((Date.now()-ts)/864e5);if(d<1)return'hoy';if(d<30)return`hace ${d} d`;if(d<365)return`hace ${Math.floor(d/30)} meses`;const y=Math.floor(d/365);return`hace ${y} año${y>1?'s':''}`}
const TYPE={album:'Álbum',single:'Single/EP',compilation:'Recopilatorio'};

async function fetchDisco(b,force){
  if(!b.sid||!tok)return false;
  if(!force&&b.fetchedAt&&Date.now()-b.fetchedAt<30*864e5)return false;
  let items;
  try{items=await spAll(`/artists/${b.sid}/albums?include_groups=album,single,compilation&limit=50`)}
  catch(e){if(/400/.test(e.message))items=await spAll(`/artists/${b.sid}/albums?include_groups=album,single,compilation&limit=10`);else throw e}
  const seen=new Map();
  for(const a of items){
    const y=(a.release_date||'').slice(0,4),type=a.album_type||'album';
    const key=type+'|'+norm(a.name).replace(/\s*[\(\[].*?(deluxe|remaster|edition|version|expanded|anniversary|edición|reedición).*?[\)\]]/g,'').replace(/\s*-\s*.*(deluxe|remaster|edition|version).*$/,'').trim();
    const prev=seen.get(key);
    if(!prev||(y&&y<prev.y))seen.set(key,{id:a.id,t:a.name,y,type,n:a.total_tracks||0,img:imgOf(a.images)});
  }
  b.albums=[...seen.values()];
  if(!b.spGenres||!b.spGenres.length||!b.img){try{const ar=await sp('/artists/'+b.sid);b.spGenres=ar.genres||[];b.img=b.img||imgOf(ar.images)}catch(_){}}
  b.fetchedAt=Date.now();touch();return true;
}

function autoMatches(){
  const subs=[];for(const g of D.tree.genres)walk(g.subs,x=>subs.push({g,s:x,n:norm(x.name)}));subs.sort((a,b)=>b.n.length-a.n.length);

  const out=[];
  for(const b of unclassified()){
    const sg=(b.spGenres||[]).map(norm);if(!sg.length)continue;
    let m=null;
    for(const x of sg){m=subs.find(s=>x===s.n)||subs.find(s=>x.includes(s.n)&&s.n.length>3);if(m)break}
    if(m){out.push({b,g:m.g.id,s:m.s.id});continue}
    for(const x of sg){const gm=gens.find(g=>x===g.n);if(gm){out.push({b,g:gm.g.id,s:null});break}}
  }
  return out;
}

/* ================= formularios ================= */
function formHtml(){
  const f=UI.form;
  const wrap=(title,inner,submit)=>`<form class="panel" id="frm"><div class="divider" style="font-size:20px">${title}</div>${inner}<div class="btns">${submit?`<button class="btn primary" type="submit">${submit}</button>`:''}<button class="btn" type="button" data-act="cancel">Cancelar</button></div></form>`;
  if(['genre','sub','renameGenre','renameSub'].includes(f.t))
    return wrap({genre:'Nuevo género',sub:'Nuevo subgénero',renameGenre:'Renombrar género',renameSub:'Renombrar subgénero'}[f.t],`<label>Nombre<input type="text" id="f_name" value="${esc(f.name||'')}" required></label>`,'Guardar');
  if(f.t==='spsearch'){
    const res=UI.spResults;
    const here=UI.view.k==='sub'?SG(G(UI.view.g),UI.view.s):UI.view.k==='genre'?G(UI.view.g):null;
    const st=a=>{const b=bandBySid(a.id);if(!b)return'+';if(here&&!f.parentId&&(UI.view.k==='sub'?inPlace(b,UI.view.g,UI.view.s):places(b).some(p=>p.g===UI.view.g)))return'✓ aquí';return here&&!f.parentId?'+ (ya la tienes)':'ya está'};
    return wrap(f.parentId?'Añadir relacionado':here?'Añadir banda a '+esc(here.name):'Añadir banda',`<div class="btns"><input type="search" id="f_sq" placeholder="Nombre del artista en Spotify" value="${esc(f.q||'')}" style="flex:1;min-width:180px"><button class="btn small" type="submit">Buscar</button></div>`+
      (res?(res.length?`<div class="list">${res.map(a=>`<button type="button" class="row" data-act="pickArtist" data-sid="${esc(a.id)}">${thumb(imgOf(a.images))}<span class="name">${esc(a.name)}<span class="sub">${esc((a.genres||[]).slice(0,3).join(' · '))}</span></span><span class="meta">${st(a)}</span></button>`).join('')}</div>`:`<div class="empty">Sin resultados.</div>`):'')+
      (f.parentId?`<label>Nota (opcional)<input type="text" id="f_note" placeholder="p. ej. disco en solitario del cantante"></label>`:''),'');
  }
  if(f.t==='edit'){
    const b=D.bands[UI.view.id];
    const banned=new Set([b.id]);let grew=true;while(grew){grew=false;for(const x of bands())if(x.parentId&&banned.has(x.parentId)&&!banned.has(x.id)){banned.add(x.id);grew=true}}
    const parents=`<option value="">— Ninguna (banda principal) —</option>`+bands().filter(x=>!banned.has(x.id)).sort(byName).map(x=>`<option value="${x.id}" ${b.parentId===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
    return wrap('Mover / editar',`<div id="placeLbl" ${b.parentId?'hidden':''} style="display:flex;flex-direction:column;gap:10px"><label>Ubicación principal${placeSelect('f_place',b.genreId,b.subId)}</label>
      <div class="section"><span class="hint">También en</span>${(b.also||[]).filter(x=>G(x.g)).length?`<div class="tags">${(b.also||[]).map((x,i)=>G(x.g)?`<button type="button" class="btn small" data-act="rmAlso" data-i="${i}">${esc(pName({g:x.g,s:x.s||null}))} ✕</button>`:'').join('')}</div>`:''}
      <div class="btns">${placeSelect('f_also','','','Añadir otra rama…')}<button type="button" class="btn small" data-act="addAlso">Añadir</button></div></div></div>
      <label>Es relacionado de<select id="f_parent">${parents}</select></label>
      <label>Nota corta<input type="text" id="f_note" value="${esc(b.note||'')}" placeholder="p. ej. antes se llamaban…"></label>
      <button class="btn danger small" type="button" data-act="askDelBand" style="align-self:flex-start">Quitar de mi colección</button>`,'Guardar');
  }
  return '';
}
const confirmHtml=()=>`<div class="panel"><div>${esc(UI.confirm.msg)}</div><div class="btns"><button class="btn danger" data-act="confirmYes">Sí, borrar</button><button class="btn" data-act="cancel">Cancelar</button></div></div>`;
async function submitForm(id){
  const val=x=>(document.getElementById(x)?.value??'').trim();
  if(id==='f_setup'||id==='f_cidform'){cfg.clientId=val('f_cid');LS.set('md_cfg',cfg);if(id==='f_setup'&&cfg.clientId)login();else{say('Client ID guardado.');}return}
  if(id==='f_sync'){cfg.ghToken=val('f_gh');cfg.gistId='';LS.set('md_cfg',cfg);if(!cfg.ghToken)return;await pushRemote();if(cfg.gistId){UI.showCode=true;say('Sincronización activada. Ahora copia el código y pégalo en el otro dispositivo.')}else{cfg.ghToken='';LS.set('md_cfg',cfg);say('No se pudo crear el Gist. Revisa que el token tenga permiso de Gists (lectura y escritura).',true)}render();return}
  if(id==='f_code'){await applyCode(val('f_codein'));return}
  if(id==='f_claude'){applyClaude(val('f_claudein'));return}
  const f=UI.form,v=UI.view;
  if(f.t==='genre'){const n=val('f_name');if(!n)return;D.tree.genres.push({id:rid(),name:n,subs:[]});touch()}
  else if(f.t==='sub'){const n=val('f_name');if(!n)return;const host=v.k==='sub'?SG(G(v.g),v.s):G(v.g);host.subs.push({id:rid(),name:n,subs:[]});touch()}
  else if(f.t==='renameGenre'){const n=val('f_name');if(!n)return;G(v.g).name=n;touch()}
  else if(f.t==='renameSub'){const n=val('f_name');if(!n)return;SG(G(v.g),v.s).name=n;touch()}
  else if(f.t==='spsearch'){f.q=val('f_sq');if(!f.q)return;try{UI.spResults=(await sp('/search?type=artist&limit=10&q='+encodeURIComponent(f.q))).artists.items}catch(e){say(e.message==='nologin'?'Conecta Spotify en Ajustes.':e.message,true)}render();return}
  else if(f.t==='year'){const b=D.bands[v.id],al=(b.albums||[]).find(x=>x.id===f.a),y=val('f_y');if(y&&!/^\d{4}$/.test(y)){say('Escribe el año con cuatro cifras, por ejemplo 1983.',true);return}b.years=b.years||{};if(!y||(al&&y===al.y))delete b.years[f.a];else b.years[f.a]=y;touch()}
  else if(f.t==='edit'){const b=D.bands[v.id];b.parentId=val('f_parent')||null;b.note=val('f_note');const [g,s]=(val('f_place')||'|').split('|');if(!b.parentId){b.genreId=g||null;b.subId=s||null;b.also=(b.also||[]).filter(x=>!(x.g===b.genreId&&(x.s||null)===(b.subId||null)));fixPrimary(b)}else{b.genreId=null;b.subId=null;b.also=[]}touch()}
  UI.form=null;render();
}

/* ================= importaciones ================= */
async function runImport(label,fn){
  UI.busy=label;render();let added=0;
  try{added=await fn(n=>{UI.busy=label+' '+n;renderBusy()});touch();if(added!==null)say(`${added} banda${added===1?'':'s'} nueva${added===1?'':'s'} en “Sin clasificar”.`)}
  catch(e){say(spErr(e),true)}
  UI.busy=null;render();
}
function renderBusy(){document.querySelectorAll('.notice').forEach(n=>{if(UI.busy&&n.textContent!==UI.busy&&/…/.test(n.textContent))n.textContent=UI.busy})}

    case'confirmYes':{const w=UI.confirm.w;UI.confirm=null;
      if(w==='genre'){for(const b of bands()){if(b.genreId===v.g){b.genreId=null;b.subId=null}b.also=(b.also||[]).filter(x=>x.g!==v.g);fixPrimary(b)}D.tree.genres=D.tree.genres.filter(g=>g.id!==v.g);touch();go({k:'home'})}
      else if(w==='sub'&&twins(SG(G(v.g),v.s)).length>1){const g=G(v.g),fs=findSub(g,v.s),tw=twins(fs.s).find(t=>t.s!==fs.s),parent=fs.path.length?fs.path[fs.path.length-1]:null;for(const b of bands()){if(b.subId===v.s){b.genreId=tw.g.id;b.subId=tw.s.id}for(const x of b.also||[])if(x.s===v.s){x.g=tw.g.id;x.s=tw.s.id}b.also=(b.also||[]).filter((x,i,arr)=>!(x.g===b.genreId&&(x.s||null)===(b.subId||null))&&arr.findIndex(y=>y.g===x.g&&(y.s||null)===(x.s||null))===i)}const moved=[];walk(fs.s.subs,x=>moved.push(x.id));for(const b of bands()){if(moved.includes(b.subId))b.genreId=tw.g.id;for(const x of b.also||[])if(moved.includes(x.s))x.g=tw.g.id}tw.s.subs=tw.s.subs.concat(fs.s.subs);const host=parent||g;host.subs=host.subs.filter(x=>x.id!==v.s);touch();go(parent?{k:'sub',g:g.id,s:parent.id}:{k:'genre',g:g.id})}
      else if(w==='sub'){const g=G(v.g),fs=findSub(g,v.s),parent=fs.path.length?fs.path[fs.path.length-1]:null,ids=new Set(descIds(fs.s));for(const b of bands()){if(b.genreId===v.g&&ids.has(b.subId))b.subId=parent?parent.id:null;for(const x of b.also||[])if(x.g===v.g&&ids.has(x.s))x.s=parent?parent.id:null;b.also=(b.also||[]).filter((x,i,arr)=>!(x.g===b.genreId&&(x.s||null)===(b.subId||null))&&arr.findIndex(y=>y.g===x.g&&(y.s||null)===(x.s||null))===i)}const host=parent||g;host.subs=host.subs.filter(x=>x.id!==v.s);touch();go(parent?{k:'sub',g:g.id,s:parent.id}:{k:'genre',g:g.id})}
      else if(w==='band'){const b=D.bands[v.id];const pl=placeOf(b);if(b.sid)D.ignored[b.sid]=b.name;for(const c of children(b.id)){c.parentId=null;c.genreId=null;c.subId=null}delete D.bands[b.id];touch();go(b.parentId&&D.bands[b.parentId]?{k:'band',id:b.parentId}:pl.s?{k:'sub',g:pl.g.id,s:pl.s.id}:pl.g?{k:'genre',g:pl.g.id}:{k:'home'})}
      break}
    case'impFollow':runImport('Leyendo artistas seguidos…',importFollowed);break;
    case'impSaved':runImport('Leyendo álbumes guardados…',async prog=>{const items=await spAll('/me/albums?limit=50');let added=0;for(const it of items){const ar=it.album&&it.album.artists&&it.album.artists[0];if(ar&&addArtist(ar).isNew)added++}prog(items.length);return added});break;
    case'loadPlaylists':runImport('Leyendo tus listas…',async()=>{const me=await sp('/me');const pls=await spAll('/me/playlists?limit=50');UI.playlists=pls.filter(p=>p&&(p.owner?.id===me.id||p.collaborative)).map(p=>({id:p.id,name:p.name,n:(p.items||p.tracks||{}).total,on:false}));return null});break;
    case'impPlaylists':{const chosen=(UI.playlists||[]).filter(p=>p.on);if(!chosen.length){say('Marca al menos una lista.',true);return}
      runImport('Leyendo listas…',async prog=>{let added=0,i=0;for(const p of chosen){i++;prog(`(${i}/${chosen.length}) ${p.name}`);const items=await spAll(`/playlists/${p.id}/items?limit=50`);for(const it of items){const t=it&&(it.item||it.track);const ar=t&&t.artists&&t.artists[0];if(ar&&ar.id&&addArtist(ar).isNew)added++}}return added});break}
    case'fetchAll':{const list=bands().filter(b=>b.sid&&!b.fetchedAt);if(!list.length){say('Todas las discografías están cargadas.');return}
      UI.busy=`Cargando discografías… 0/${list.length}`;render();let i=0;
      let stop=null;for(const b of list){try{await fetchDisco(b)}catch(err){if(err.message==='nologin'||err.message==='ratelimit'){stop=err;break}}i++;UI.busy=`Cargando discografías… ${i}/${list.length}`;renderBusy();await sleep(400)}
      UI.busy=null;touch();if(stop)say(spErr(stop)+` Se han cargado ${i} de ${list.length}; cuando pase, pulsa otra vez y seguirá donde lo dejó.`,true);else say('Discografías cargadas.');break}
  }
});
app.addEventListener('change',e=>{
  if(e.target.dataset.sel){e.target.checked?UI.sel.add(e.target.dataset.sel):UI.sel.delete(e.target.dataset.sel);const m=document.querySelector('.bar .meta');if(m)m.textContent=UI.sel.size+' marcadas';document.querySelectorAll('[data-act="moveSel"],[data-act="addSel"],[data-act="delSel"]').forEach(btn=>btn.disabled=!UI.sel.size)}
  if(e.target.dataset.pl){const p=UI.playlists.find(x=>x.id===e.target.dataset.pl);if(p)p.on=e.target.checked}
  if(e.target.id==='f_auto'){cfg.autoImport=e.target.checked;LS.set('md_cfg',cfg);return}
  if(e.target.id==='f_favplace'){UI.view={...UI.view,place:e.target.value};render();return}
  if(e.target.id==='f_rtplace'){UI.view={...UI.view,place:e.target.value};render();return}
  if(e.target.id==='f_parent'){const l=document.getElementById('placeLbl');if(l)l.hidden=!!e.target.value}
});
app.addEventListener('submit',e=>{e.preventDefault();submitForm(e.target.id)});
app.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}});

/* ================= render ================= */
function renderSync(){const s=document.getElementById('syncst');if(s){s.textContent=UI.syncState;s.title=UI.syncErr||'';s.classList.toggle('bad',UI.syncState==='Sin sincronizar')}}
function bandCover(b){const al=(b.albums||[]).filter(a=>a.img&&!(b.hidden||[]).includes(a.id)),pk=new Set(b.picked||[]),mine=al.filter(a=>pk.has(a.id)),pool=mine.length?mine:al.filter(a=>a.type!=='single').length?al.filter(a=>a.type!=='single'):al;return pool.length?pool[Math.floor((UI.bgPick||0)*pool.length)%pool.length].img:(b.img||'')}
function paintBg(){const el=document.getElementById('bg');if(!el)return;const b=UI.view.k==='band'&&D.bands[UI.view.id];const url=b?bandCover(b):'';const cv=el.firstElementChild;
  if(url){const css=`url("${url.replace(/"/g,'%22')}")`;if(cv.style.backgroundImage!==css)cv.style.backgroundImage=css;el.classList.add('on')}else el.classList.remove('on')}
function render(){try{renderInner();paintBg()}catch(e){showFatal(e)}}
function renderInner(){
  const keep={};document.querySelectorAll('#frm input,#frm select').forEach(el=>{if(el.id)keep[el.id]=el.value});
  const v=UI.view.k;
  const body=!cfg.clientId?vSetup():v==='genre'?vGenre():v==='sub'?vSub():v==='band'?vBand():v==='forgotten'?vForgotten():v==='favs'?vFavs():v==='rated'?vRated():v==='import'?vImport():v==='settings'?vSettings():v==='unclassified'?vUnclassified():vHome();
  let notes='';
  if(cfg.clientId&&!tok&&v!=='settings')notes+=`<div class="notice">Spotify no está conectado. <button class="btn small spot" data-act="login">Conectar</button></div>`;
  if(UI.msg)notes+=`<div class="notice${UI.msg.err?' err':''}">${esc(UI.msg.text)}</div>`;
  if(UI.undo)notes+=`<div class="notice">${UI.undo.bands.length===1?`“${esc(UI.undo.bands[0].name)}” quitada de tu colección.`:`${UI.undo.bands.length} bandas quitadas de tu colección.`} <button class="btn small" data-act="undo">Deshacer</button></div>`;
  const n=bands().length;
  app.innerHTML=`<header class="top"><button class="brand" data-act="home"><img class="logo" src="logo.svg" alt="">Spotify <span>Soul</span></button><div class="btns"><button class="sync${UI.syncState==='Sin sincronizar'?' bad':''}" id="syncst" data-act="syncInfo" title="${esc(UI.syncErr||'')}">${esc(UI.syncState)}</button>${cfg.clientId?`<button class="btn small" data-act="settings">Ajustes</button>`:''}</div></header>${notes}${body}${n?`<div class="foot">${n} bandas</div>`:''}`;
  for(const id in keep){const el=document.getElementById(id);if(el&&el.type!=='checkbox')el.value=keep[id]}
}

/* ================= arranque ================= */
function showFatal(e){console.error(e);app.innerHTML=`<header class="top"><button class="brand" onclick="location.reload()">Spotify <span>Soul</span></button></header><div class="notice err"><b>Algo ha fallado al mostrar la colección.</b> Copia este mensaje y pásaselo a Claude:<br><code>${esc((e&&e.message)||e)}</code><br><code>${esc(((e&&e.stack)||'').split('\n').slice(0,3).join(' | '))}</code></div><div class="btns"><button class="btn" onclick="location.reload()">Recargar</button></div>`}
window.addEventListener('error',ev=>{if(!app.querySelector('header'))showFatal(ev.error||ev.message)});
window.addEventListener('unhandledrejection',ev=>{if(!app.querySelector('header'))showFatal(ev.reason)});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
window.addEventListener('popstate',e=>{const v=e.state&&e.state.v;go(v&&v.k?v:{k:'home'},true)});
(async()=>{try{fixTree();render()}catch(e){showFatal(e);return}await handleCallback();try{history.replaceState({v:UI.view},'')}catch(_){}try{render()}catch(e){showFatal(e)}await pullRemote();await autoImport();})();
})();
</script>
